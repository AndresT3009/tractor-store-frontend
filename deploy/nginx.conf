server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # remoteEntry.json y los chunks los piden otros orígenes (los demás MFEs); sin este header el
  # navegador bloquea el fetch() que hace el runtime de Native Federation para leerlos.
  add_header Access-Control-Allow-Origin * always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
